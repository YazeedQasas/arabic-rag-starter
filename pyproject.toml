[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-rag-starter"
version = "0.1.0"
description = "Hybrid retrieval for Arabic text: normalization, BM25, character n-grams and reciprocal-rank fusion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # core uses the standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
